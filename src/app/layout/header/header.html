<header class="header">
  <div class="header__inner">
    <a class="header__logo" routerLink="/" aria-label="GIF Finder — home">
      <img src="/logo/logo.svg" alt="GIF Finder Logo" />
    </a>
    <form class="form" (submit)="onSubmit($event)">
      <gfd-text-field
        class="form__input"
        placeholder="Search for gifs"
        errorMessage="Enter a keyword to search"
        [(value)]="searchTerm"
        [isInvalid]="isInvalid()"
        [isTouched]="isSubmitted()"
      />
      <gfd-button type="submit" variant="icon" ariaLabel="Search">
        <ng-icon [svg]="searchIcon" size="20" />
      </gfd-button>
    </form>
  </div>
</header>
