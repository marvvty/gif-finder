<div class="gif-item">
  <a class="gif-item__link" [routerLink]="['/gif', gif().id]">
    <img
      class="gif-item__img"
      [src]="gif().previewUrl"
      [alt]="gif().title"
      [attr.width]="gif().originalWidth"
      [attr.height]="gif().originalHeight"
      loading="lazy"
      decoding="async"
    />
  </a>

  <span class="gif-item__author">By: {{ gif().author }}</span>

  <gfd-button
    class="gif-item__copy"
    variant="icon"
    [ariaLabel]="copyLabel()"
    (btnClick)="copyLink()"
  >
    <ng-icon [svg]="isCopied() ? checkIcon : linkIcon" size="18" />
  </gfd-button>

  <span class="gif-item__status" role="status" aria-live="polite">
    @if (isCopied()) {
      Link copied
    }
  </span>
</div>
