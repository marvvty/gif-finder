@if (gifs.isLoading()) {
  <div class="state">
    <ng-icon class="state__spinner" [svg]="svg" size="38"></ng-icon>
    <p class="state__text">Loading...</p>
  </div>
} @else if (gifs.error()) {
  <div class="state">
    <p class="state__text">Try again later</p>
    <gfd-button type="button" (btnClick)="gifs.reload()" label="Try Again" />
  </div>
} @else if (gifs.value().length === 0) {
  <div class="state">
    <p class="state__text">Nothing found for "{{ query() }}"</p>
    <p class="state__hint">Try a different keyword.</p>
  </div>
} @else {
  <div class="content">
    <gfd-gif-list [gifs]="gifs.value()" />
    <gfd-button
      class="content__more"
      type="button"
      variant="secondary"
      (btnClick)="gifs.reload()"
      label="Load More"
    />
  </div>
}
