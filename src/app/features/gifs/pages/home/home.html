@if (page.isLoading() && isEmpty()) {
  <gfd-state isLoading text="Loading..." />
} @else if (page.error() && isEmpty()) {
  <gfd-state text="Try again later">
    <gfd-button label="Try Again" (btnClick)="page.reload()" />
  </gfd-state>
} @else if (isEmpty()) {
  <gfd-state [text]="emptyMessage()" hint="Try a different keyword." />
} @else {
  <div class="content">
    <gfd-gif-list [gifs]="gifs()" />

    @if (page.error()) {
      <gfd-button
        class="content__more"
        variant="secondary"
        label="Try Again"
        (btnClick)="page.reload()"
      />
    } @else if (hasMore()) {
      <gfd-button
        class="content__more"
        variant="secondary"
        label="Load More"
        [isDisabled]="page.isLoading()"
        (btnClick)="loadMore()"
      />
    }
  </div>
}
