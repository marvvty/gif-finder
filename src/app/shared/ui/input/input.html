<input
  class="input"
  [class.input--invalid]="invalid() && touched()"
  [type]="type()"
  [placeholder]="placeholder()"
  [attr.aria-label]="ariaLabel() || placeholder()"
  [attr.aria-invalid]="invalid() && touched() ? 'true' : null"
  [value]="value()"
  [disabled]="disabled()"
  (input)="onInput($event)"
  (blur)="touch.emit()"
/>
